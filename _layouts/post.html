---
layout: default
---
<article class="page">
  <header class="page-head wrap">
    <p class="page-head__eyebrow">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    </p>
    <h1 class="page-head__title">{{ page.title }}</h1>
    {%- if page.subtitle %}
    <p class="page-head__sub">{{ page.subtitle }}</p>
    {%- endif %}
  </header>

  <div class="wrap">
    <div class="prose">
      {{ content }}
    </div>
    <p class="post-back"><a href="{{ '/writing/' | relative_url }}">&larr; All writing</a></p>
  </div>
</article>
