- title: "Stripe's $500M bet to cure the common cold"
  outlet: "Lifers with Christina Farr · Second Opinion"
  url: "https://secondopinion.media/podcast/s/lifers_with_christina_farr/dr_aartik_sarma_ucsf_on_stripe_s_500m_bet_to_cure_the_common_cold"
  role: Guest
  date: "July 2026"
  host: "Christina Farr"
  featured: true
  blurb: >-
    On Intercept, the $500M initiative from Stripe, OpenAI, and Anthropic aimed
    at the common cold and flu: why a "cold" is a large and constantly mutating
    spectrum of viruses rather than one disease, why treatments like Tamiflu
    barely move the needle, and where the money would do the most good — indoor
    air filtration and nasal sprays in the near term, and vaccines targeting the
    conserved parts of these viruses over the longer one.

- title: "Are we designing connection or escaping it? AI, teens, and the future of being human"
  outlet: "Second Opinion"
  url: "https://secondopinion.media/p/roundup-are-we-designing-connection-or-escaping-it-ai-teens-and-the-future-of-being-human"
  role: Interviewed
  featured: true
  blurb: >-
    An interview on where machine learning actually helps in medicine and where
    a large language model is the wrong tool, what it takes for a clinician to
    contribute to medical AI, and why data fragmentation — not model
    architecture — is the binding constraint on precision medicine.
  quote: >-
    The art of computational medical research is understanding what the right
    tool is to use for a specific question. More focused tools can often get you
    to an answer faster and in a more explainable fashion.
