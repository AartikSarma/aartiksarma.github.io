# ---------------------------------------------------------------------------
# Software and open code
# ---------------------------------------------------------------------------
# NOTE: nothing renders this file at the moment. The Software page is switched
# off — software.html carries `published: false`, and its header comment lists
# the three steps to bring it back. This data is kept so that restoring the page
# needs no rewriting.
# ---------------------------------------------------------------------------
# Fields: name, repo (GitHub path), lang, blurb, group
# group: one of  tools | experiments
#
# There is deliberately no group for per-paper analysis code: each paper links
# its own repository from _data/publications.yml, so listing them here too only
# duplicated that.
# ---------------------------------------------------------------------------

- name: clifR
  repo: aartiksarma/clifR
  lang: R
  group: tools
  blurb: >-
    An R port of clifpy for working with CLIF-format critical care data.
    CLIF is a common data model that lets ICU studies run the same analysis
    code across hospitals without moving patient data between them.

- name: clifphewas
  repo: aartiksarma/clifphewas
  lang: R
  group: tools
  blurb: >-
    Federated phenome-wide association studies on CLIF ICU data, in a tidy
    interface. Each site runs the analysis locally and shares only summary
    statistics.

- name: tidyseq
  repo: aartiksarma/tidyseq
  lang: R
  group: tools
  blurb: >-
    Tidyverse-style wrappers for RNA-seq analysis in Bioconductor, so a
    differential expression workflow reads like the rest of your pipeline.

- name: bayestrials
  repo: aartiksarma/bayestrials
  lang: R
  group: tools
  blurb: >-
    Reproducible Bayesian re-analyses of clinical trials — a way to ask what a
    trial result actually implies under different priors, rather than treating
    p = 0.05 as a verdict.

- name: omics_interpreter
  repo: aartiksarma/omics_interpreter
  lang: Python
  group: experiments
  blurb: >-
    An LLM agent that runs a differential expression analysis, mines the
    literature for context, and drafts an interpretation. An experiment in how
    far automated interpretation of omics data can be pushed.

- name: dilution
  repo: aartiksarma/dilution
  lang: Python
  group: experiments
  blurb: >-
    Monte Carlo simulations of dilution effects in respiratory biomarkers — how
    much of a "signal" in airway fluid is really just how much saline was
    instilled.

- name: pubmed_slackbot
  repo: aartiksarma/pubmed_slackbot
  lang: Python
  group: experiments
  blurb: >-
    A Slack bot that watches PubMed for new papers matching a saved query and
    posts them to a channel.

- name: CLIF-PBWPFVC
  repo: aartiksarma/CLIF-PBWPFVC
  lang: R
  group: experiments
  blurb: >-
    A federated, multi-site extension of the tidal volume work, implemented
    against the CLIF common data model.
